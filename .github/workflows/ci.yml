name: Java CI Build
jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload build artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: built-mod-jar
        path: build/libs/*.jar
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    paths-ignore:
    - src/main/resources/assets/hbm_m/lang/**
